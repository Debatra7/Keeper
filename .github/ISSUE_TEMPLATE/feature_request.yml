name: Feature Request
description: Suggest an idea or feature enhancement for Keeper
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Keeper even better? Let us know!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature or improvement you'd like.
    validations:
      required: true
  - type: textarea
    id: problem-solved
    attributes:
      label: Problem / Motivation
      description: What problem or limitation does this feature solve?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false
